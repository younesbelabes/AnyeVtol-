<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyeVTOL | Global eVTOL Directory & Air Mobility Platform</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-main: #060b14;
            --bg-card: #0d1626;
            --bg-card-hover: #132038;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --brand-dark: #1d4ed8;
            --brand-light: #38bdf8;
            --border-color: rgba(56, 189, 248, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Unified Gradient Brand Logo: Dark in 'Any', Light in 'eVTOL' */
        .brand-logo {
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 38%, #38bdf8 70%, #bae6fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* Top Acquisition Notice Bar */
        .acquisition-bar {
            background: linear-gradient(90deg, rgba(29, 78, 216, 0.25), rgba(56, 189, 248, 0.2));
            border-bottom: 1px solid rgba(56, 189, 248, 0.25);
            padding: 0.6rem 5%;
            text-align: center;
            font-size: 0.85rem;
            color: #e0f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .acquisition-bar a {
            color: #38bdf8;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        header {
            background: rgba(6, 11, 20, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            font-size: 1.85rem;
            text-decoration: none;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--brand-light);
        }

        .nav-acquire-btn {
            padding: 0.45rem 1rem;
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #38bdf8 !important;
            font-weight: 600;
        }

        .hero {
            text-align: center;
            padding: 4.5rem 5% 3rem;
            background: radial-gradient(circle at top center, rgba(37, 99, 235, 0.16) 0%, transparent 70%);
        }

        .hero h1 {
            font-size: 3.1rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero p {
            color: var(--text-secondary);
            max-width: 680px;
            margin: 0 auto 2rem;
            font-size: 1.08rem;
        }

        .controls {
            max-width: 1140px;
            margin: 0 auto 2.5rem;
            padding: 0 5%;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 260px;
            padding: 0.85rem 1.2rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--brand-light);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: linear-gradient(90deg, var(--brand-dark), var(--brand-light));
            color: #fff;
            border-color: transparent;
        }

        /* Directory Grid with Real Photos */
        .directory {
            max-width: 1140px;
            margin: 0 auto 4rem;
            padding: 0 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.75rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.25s, background 0.25s, border-color 0.25s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            background: var(--bg-card-hover);
            border-color: rgba(56, 189, 248, 0.45);
        }

        .card-img-wrapper {
            width: 100%;
            height: 200px;
            background: #09111e;
            position: relative;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.75rem;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            background: rgba(6, 11, 20, 0.82);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--brand-light);
            font-weight: 600;
        }

        .card-body {
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .card-company {
            font-size: 0.85rem;
            color: var(--brand-light);
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .card-desc {
            color: var(--text-secondary);
            font-size: 0.88rem;
            margin-bottom: 1.25rem;
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            text-align: center;
        }

        .spec-item span {
            display: block;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .spec-item strong {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        /* Live Comparison Section */
        .compare-section {
            max-width: 1140px;
            margin: 0 auto 4rem;
            padding: 0 5%;
        }

        .compare-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
        }

        .compare-box h2 {
            font-size: 1.5rem;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        .compare-selectors {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .compare-select {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            min-width: 220px;
            font-size: 0.95rem;
        }

        .compare-result {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            text-align: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .compare-col h3 {
            color: var(--brand-light);
            margin-bottom: 0.5rem;
        }

        .compare-col p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0.25rem 0;
        }

        /* Professional Acquisition Section */
        .acquire-section {
            max-width: 1040px;
            margin: 0 auto 4rem;
            padding: 3rem 2rem;

            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            text-align: center;
        }
